<section class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="login__header">
      <div class="login__logo" aria-hidden="true">TF</div>
      <h1 class="login__title">Set your new password</h1>
      <p class="login__subtitle">An administrator set a new password for this account. Choose your own to continue.</p>
    </header>

    @if (email) {
      <div class="login__field">
        <span class="login__label">Account</span>
        <span class="login__account" data-field="account">{{ email }}</span>
      </div>
    }

    <label class="login__field">
      <span class="login__label">New password</span>
      <input type="password" formControlName="newPassword" data-field="newPassword" autocomplete="new-password" maxlength="128" />
      @if (fieldError('newPassword'); as message) {
        <span class="login__hint" role="alert" data-error="newPassword">{{ message }}</span>
      }
    </label>

    <label class="login__field">
      <span class="login__label">Confirm password</span>
      <input type="password" formControlName="confirmPassword" data-field="confirmPassword" autocomplete="new-password" maxlength="128" />
      @if (fieldError('confirmPassword'); as message) {
        <span class="login__hint" role="alert" data-error="confirmPassword">{{ message }}</span>
      }
    </label>

    @if (errorMessage(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="login__submit" data-action="update-password" [disabled]="submitting()">
      {{ submitting() ? 'Updating…' : 'Update password' }}
    </button>
  </form>
</section>
