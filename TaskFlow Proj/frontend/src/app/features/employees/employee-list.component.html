<div class="container-fluid">
  <h2>Employees</h2>
  <div *ngIf="error()" class="alert alert-danger">{{ error() }}</div>
  <button *ngIf="isAdmin()" class="btn btn-primary mb-3" (click)="add()">Add Employee</button>

  <form *ngIf="showForm()" class="mb-3" (ngSubmit)="save()">
    <div class="row">
      <div class="col-md-6 mb-2">
        <input type="text" class="form-control" [(ngModel)]="fullName" name="fullName" placeholder="Full Name" required>
      </div>
      <div class="col-md-6 mb-2">
        <input type="text" class="form-control" [(ngModel)]="username" name="username" placeholder="Username" required>
      </div>
      <div class="col-md-6 mb-2">
        <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Email" required>
      </div>
      <div class="col-md-6 mb-2" *ngIf="editing() === null">
        <input type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Password" required>
      </div>
      <div class="col-md-4 mb-2">
        <select class="form-control" [(ngModel)]="employeeRole" name="employeeRole">
          <option value="Employee">Employee</option>
          <option value="Manager">Manager</option>
          <option value="Administrator">Administrator</option>
        </select>
      </div>
      <div class="col-md-4 mb-2">
        <select class="form-control" [(ngModel)]="employeeDepartmentId" name="employeeDepartmentId">
          <option [ngValue]="null">No Department</option>
          <option *ngFor="let dept of departments()" [ngValue]="dept.id">{{ dept.name }}</option>
        </select>
      </div>
      <div class="col-md-4 mb-2" *ngIf="editing() === null">
        <select class="form-control" [(ngModel)]="employeeActive" name="employeeActive">
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-success me-2" [disabled]="loading()">Save</button>
    <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="loading()">Cancel</button>
  </form>

  <form class="row mb-3" (ngSubmit)="applyFilters()">
    <div class="col-md-3 mb-2">
      <input type="text" class="form-control" [(ngModel)]="search" name="search" placeholder="Search name/email">
    </div>
    <div class="col-md-3 mb-2">
      <select class="form-control" [(ngModel)]="departmentId" name="departmentId">
        <option [ngValue]="null">All Departments</option>
        <option *ngFor="let dept of departments()" [ngValue]="dept.id">{{ dept.name }}</option>
      </select>
    </div>
    <div class="col-md-2 mb-2">
      <select class="form-control" [(ngModel)]="role" name="role">
        <option value="">All Roles</option>
        <option value="Employee">Employee</option>
        <option value="Manager">Manager</option>
        <option value="Administrator">Administrator</option>
      </select>
    </div>
    <div class="col-md-2 mb-2">
      <select class="form-control" [(ngModel)]="isActive" name="isActive">
        <option value="">All Status</option>
        <option [ngValue]="true">Active</option>
        <option [ngValue]="false">Inactive</option>
      </select>
    </div>
    <div class="col-md-2 mb-2">
      <button type="submit" class="btn btn-secondary" [disabled]="loading()">Filter</button>
    </div>
  </form>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Username</th>
        <th>Role</th>
        <th>Department</th>
        <th>Status</th>
        <th *ngIf="isAdmin()">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of employees()">
        <td>{{ user.fullName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.departmentName }}</td>
        <td>{{ user.isActive ? 'Active' : 'Inactive' }}</td>
        <td *ngIf="isAdmin()">
          <button class="btn btn-sm btn-primary me-2" (click)="edit(user)" [disabled]="loading()">Edit</button>
          <button class="btn btn-sm btn-secondary" (click)="toggleStatus(user)" [disabled]="loading()">
            {{ user.isActive ? 'Deactivate' : 'Activate' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
