<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TaskFlow — Intelligent Task Allocation &amp; Tracking System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Jojo George">
  <meta name="description" content="TaskFlow allocates, tracks and reports on organisational work across departments, with deadline reminders and a built-in assistant.">
  <meta name="copyright" content="© 2026 Jojo George. All Rights Reserved.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint so there is no flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('tf.theme');
        if (t === 'professional' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
